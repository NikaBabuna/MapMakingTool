# File: .github/workflows/ci.yml
# Purpose: CI — runs the witness command on main: JDK 21 for the Java modules, Node for the web front's tests
# Audience: Build / agents
# Update when: The witness command or the tools it needs change

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: mvnw test (JDK 21, Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      - name: Install the web front's packages
        working-directory: ui/web
        run: npm ci

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test
