# File: ui/desktop/src-tauri/Cargo.toml
# Purpose: The desktop shell's Rust crate: its name, its library, and its Tauri dependencies
# Audience: Cargo; agents changing the shell's dependencies
# Update when: A dependency, the crate's name, or its library changes

[package]
name = "aethelgard"
version = "0.1.0"
description = "Aethelgard desktop shell — Tauri webview over MapHost + Next"
authors = ["Aethelgard"]
edition = "2021"

[lib]
name = "aethelgard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
